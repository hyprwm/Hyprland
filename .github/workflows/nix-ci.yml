name: BreakLand Nix

on: [push, pull_request, workflow_dispatch]

jobs:
  update-inputs:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/nix-update-inputs.yml
    secrets: inherit

  breakland:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork)
    uses: hyprwm/actions/.github/workflows/nix.yml@main
    secrets: inherit
    with:
      checkout: false
      command: nix build 'github:${{ github.repository }}?ref=${{ github.ref }}#breakland' -L

  portal:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork)
    needs: breakland
    uses: hyprwm/actions/.github/workflows/nix.yml@main
    secrets: inherit
    with:
      checkout: false
      command: nix build 'github:${{ github.repository }}?ref=${{ github.ref }}#xdg-desktop-portal-breakland' -L

  test:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork)
    uses: ./.github/workflows/nix-test.yml
    secrets: inherit
