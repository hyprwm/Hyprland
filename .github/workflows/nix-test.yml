name: BreakLand Nix (Test)

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: hyprwm/actions/nix-setup@main
        with:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run test VM
        run: nix build 'github:${{ github.repository }}?ref=${{ github.ref }}#checks.x86_64-linux.tests' -L

      - name: Check exit status
        run: |
          grep 0 result/exit_status_gtests || echo "BreakLand gtests failed"
          [ 0 = $(cat result/exit_status_gtests) ]

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: result
